# Vision Gain for Hummingbird - 🔥 修改为稳定的控制参数
gains:
  pos: {x: 5.0, y: 5.0, z: 15.0}   # 位置控制增益 (降低，避免饱和)
  vel: {x: 3.0, y: 3.0, z: 5.0}    # 速度控制增益 (降低z轴增益)
  rot: {x: 1.5, y: 1.5, z: 0.5}    # 姿态控制增益 (降低，减少震荡)
simgains:
  angP: {x: 0.1, y: 0.1, z: 0.05}  # 角速度P增益 (降低，减少震荡)
  angI: {x: 0.05, y: 0.05, z: 0.05} # 角速度I增益 (降低)
  angD: {x: 0.0, y: 0.0, z: 0.0}   # 角速度D增益 (保持不变)

