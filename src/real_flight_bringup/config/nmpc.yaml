# Jiangyin NMPC默认参数；确认定位坐标轴后再在真机上调节。
nmpc_Qposx: 50.0
nmpc_Qposy: 50.0
nmpc_Qposz: 80.0
nmpc_Qvelx: 4.0
nmpc_Qvely: 4.0
nmpc_Qvelz: 3.0
nmpc_Qquatx: 1.0
nmpc_Qquaty: 1.0
nmpc_Qquatz: 1.0
nmpc_Rwx: 0.9
nmpc_Rwy: 0.9
nmpc_Rwz: 0.5
nmpc_RtotalF: 0.1
nmpc_hover_thrust: 0.48
nmpc_gravity: 9.8015
nmpc_hover_x: 0.0
nmpc_hover_y: 0.0
nmpc_hover_z: 0.5
nmpc_hover_yaw: 0.0
# 3Droll 分支全部角速度/推力指令统一走可逆 MAVROS 姿态插件。
# MAVROS 必须在启动前配置 setpoint_attitude/reverse_thrust=true。
enable_cmd8: true
roll_duration_sec: 1.2
roll_rate_limit: 6.0
roll_min_height: 1.5
roll_max_entry_speed: 0.25
roll_state_timeout_sec: 0.3
inverted_land_speed: 0.20
planner_command_topic: /position_command
planner_horizon_topic: /position_command_horizon
planner_command_timeout: 0.5

# 与 Jiangyin/nmpc 相同的有界 XY 位置积分修正。
nmpc_enable_xy_integral: true
nmpc_xy_integral_gain: 0.08
nmpc_xy_integral_limit: 0.10
nmpc_xy_integral_leak: 0.01
nmpc_xy_integral_max_error: 0.30

# 非线性扰动观测器（NDOB）。估计量为世界坐标系下的等效加速度扰动，
# 并作为常值扰动加入整个 NMPC 预测时域。抓取负载后通常首先表现为负 Z 扰动。
nmpc_ndob_enable: true
# 观测器带宽 rad/s：Z 轴稍快以补偿负载，XY 保守以避免速度噪声引起倾斜抖动。
nmpc_ndob_bandwidth_x: 2.0
nmpc_ndob_bandwidth_y: 2.0
nmpc_ndob_bandwidth_z: 3.0
# 扰动估计限幅 m/s^2；必须保留足够的总推力余量。
nmpc_ndob_limit_x: 3.0
nmpc_ndob_limit_y: 3.0
nmpc_ndob_limit_z: 6.0
