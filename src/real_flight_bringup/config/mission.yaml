# Final flight mission. Mission.mode selects the active goal source:
# single = original SetPos -> /goal flow; multi = Mission.waypoints sequence.
# For multi mode, manually copy the recorded waypoints from flight_waypoints.yaml
# into Mission.waypoints, keeping their id, flight_mode, XYZ and yaw fields.
# The start point is always current odometry at trigger time.

Mission:
  mode: single
  frame_id: world
  waypoints: []

SetPos: [0.0, 3.5, 1.40]
SetAtt: [0.0, 0.0, 1.0, 0.0]

GoalPublish:
  topic: "/goal"
  frame_id: "world"
  delay_sec: 3.0
  repeat_count: 5
